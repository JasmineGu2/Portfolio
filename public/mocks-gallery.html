<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Mocks Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8f8f8;
      color: #333;
      padding: 40px 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 40px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      text-decoration: none;
      color: #0e3b8f;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 0.7;
    }

    h1 {
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 40px;
    }

    .section {
      margin-bottom: 60px;
    }

    .section h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .mock-card {
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-decoration: none;
      color: #0e3b8f;
      background-color: white;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }

    .mock-card:hover {
      background-color: #e8f0ff;
      border-color: #0e3b8f;
      transform: translateY(-2px);
    }

    .mock-number {
      font-weight: 600;
      font-size: 14px;
    }

    .mock-name {
      font-size: 12px;
      color: #666;
    }

    .mock-card.incomplete {
      opacity: 0.6;
      cursor: not-allowed;
      background-color: #f0f0f0;
    }

    .mock-card.incomplete:hover {
      background-color: #f0f0f0;
      border-color: #ddd;
      transform: none;
    }

    .status {
      font-size: 11px;
      color: #999;
      font-style: italic;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      margin-bottom: 30px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }

    .search-box:focus {
      outline: none;
      border-color: #0e3b8f;
      box-shadow: 0 0 0 3px rgba(14, 59, 143, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="/" class="back-link">← Back to portfolio</a>
      <h1>Design Mocks Gallery</h1>
      <p class="subtitle">Browse all <span id="total">70+</span> design iterations</p>
      <input type="text" class="search-box" id="searchBox" placeholder="Search mocks by name or number...">
    </div>

    <div class="section">
      <h2>Design Iterations (1-68)</h2>
      <div class="grid" id="numberedMocks"></div>
    </div>

    <div class="section">
      <h2>Special Designs</h2>
      <div class="grid" id="specialMocks"></div>
    </div>
  </div>

  <script>
    const mocks = [
      { id: 1, name: 'Margin Notes' },
      { id: 2, name: 'Exploded Layers' },
      { id: 3, name: 'Skills City' },
      { id: 4, name: 'Scrapbook Desk' },
      { id: 5, name: 'Drafting the Name' },
      { id: 6, name: 'Pinboard Canvas' },
      { id: 7, name: 'Pinboard Organized' },
      { id: 8, name: 'Layers First' },
      { id: 9, name: 'The Route' },
      { id: 10, name: 'Notepad Desk' },
      { id: 11, name: 'Drafting Sheet' },
      { id: 12, name: 'Bands' },
      { id: 13, name: 'Sheet on the Table' },
      { id: 14, name: 'Full Blueprint' },
      { id: 15, name: 'City Hero' },
      { id: 16, name: 'Layers Hero Map Tab' },
      { id: 17, name: 'Blueprint Hero Big Tiles' },
      { id: 18, name: 'Reference' },
      { id: 19, name: 'Reference Box' },
      { id: 20, name: 'Notes Sheet Staggered' },
      { id: 21, name: 'Exploded Featured Lead' },
      { id: 22, name: 'Map First Rows' },
      { id: 23, name: 'About Page' },
      { id: 24, name: 'Map Strip' },
      { id: 25, name: 'Map Rings Grey' },
      { id: 26, name: 'Map Rings Logos' },
      { id: 27, name: 'Map Plan Navy' },
      { id: 28, name: 'Map Plan Grey Logos' },
      { id: 29, name: 'Map City Grid' },
      { id: 30, name: 'Map Contour' },
      { id: 31, name: 'Map Constellation' },
      { id: 32, name: 'Map Isometric' },
      { id: 33, name: 'Map Rings Time' },
      { id: 34, name: 'Home v2' },
      { id: 35, name: 'About v2 (★ Current)' },
      { id: 36, name: 'Type Options' },
      { id: 37, name: 'Roads Converging' },
      { id: 38, name: 'Roads Kilometre Markers' },
      { id: 39, name: 'Roads Underground' },
      { id: 40, name: 'Roads City Growth' },
      { id: 41, name: 'Roads Dense District' },
      { id: 42, name: 'Roads Partial Ring' },
      { id: 43, name: 'Roads Rail Line' },
      { id: 44, name: 'Roads Section Cut' },
      { id: 45, name: 'Roads Tracing Paper' },
      { id: 46, name: 'Roads Tracing Paper 2' },
      { id: 47, name: 'Stack Options' },
      { id: 48, name: 'Story Press to Build' },
      { id: 49, name: 'Story Slow Film' },
      { id: 50, name: 'Story Scroll Ledger' },
      { id: 51, name: 'Story Drive the Avenue' },
      { id: 52, name: 'Story Fill the Jar' },
      { id: 53, name: 'Two Roads Parallel' },
      { id: 54, name: 'Compass Rose' },
      { id: 55, name: 'Dual Track Timeline' },
      { id: 56, name: 'Timeline Strips' },
      { id: 57, name: 'Double Helix' },
      { id: 59, name: 'Growth Enhanced' },
      { id: 60, name: 'Growth Two Roads' },
      { id: 61, name: 'Growth Depth Shade' },
      { id: 62, name: 'Growth Highlight' },
      { id: 63, name: 'Growth Two Roads v2' },
      { id: 64, name: 'Growth Depth Shade v2' },
      { id: 65, name: 'Growth Highlight v2' },
      { id: 66, name: 'Animated Growth' },
      { id: 67, name: 'Full Animation' },
      { id: 68, name: 'Route Focus' },
    ];

    const specialMocks = [
      { name: 'Index', path: 'index' },
      { name: 'Hero Variations', path: 'hero-variations' },
      { name: 'Converging Wedge', path: 'm52-converging-wedge' },
      { name: 'Stacked Timeline', path: 'm53-stacked-timeline' },
      { name: 'Skill Streams', path: 'm54-skill-streams' },
      { name: 'Spiral Ascent', path: 'm55-spiral-ascent' },
      { name: 'Minimal Double Helix', path: 'm56-minimal-double-helix' },
      { name: 'Lens Focus', path: 'm57-lens-focus' },
      { name: 'Trajectory Matrix', path: 'm58-trajectory-matrix' },
    ];

    function renderMocks() {
      const numberedContainer = document.getElementById('numberedMocks');
      const specialContainer = document.getElementById('specialMocks');

      mocks.forEach(mock => {
        const card = document.createElement('a');
        card.className = 'mock-card';
        card.href = `/mocks/${mock.id}-${mock.name.toLowerCase().replace(/\s+/g, '-')}.html`;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.innerHTML = `
          <div class="mock-number">Mock ${mock.id}</div>
          <div class="mock-name">${mock.name}</div>
        `;
        numberedContainer.appendChild(card);
      });

      specialMocks.forEach(mock => {
        const card = document.createElement('a');
        card.className = 'mock-card';
        card.href = `/mocks/${mock.path}.html`;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.innerHTML = `
          <div class="mock-number">${mock.name}</div>
          <div class="mock-name">${mock.path}</div>
        `;
        specialContainer.appendChild(card);
      });

      document.getElementById('total').textContent = (mocks.length + specialMocks.length);
    }

    function filterMocks(searchTerm) {
      const cards = document.querySelectorAll('.mock-card');
      const term = searchTerm.toLowerCase();

      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(term) ? 'flex' : 'none';
      });
    }

    document.getElementById('searchBox').addEventListener('input', (e) => {
      filterMocks(e.target.value);
    });

    renderMocks();
  </script>
</body>
</html>
