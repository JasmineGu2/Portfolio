<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock 53 · Stacked Timeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #0e3b8f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    svg { display: block; max-width: 100%; }

    .year-row { }
    .year-label { font-size: 18px; font-weight: 700; fill: rgba(255,255,255,0.7); }

    .road-eng { stroke: #fff; stroke-width: 24; fill: none; }
    .road-prod { stroke: #fff; stroke-width: 14; fill: none; }

    .exp-pin { cursor: pointer; transition: all 0.2s; }
    .exp-pin circle { fill: #fff; r: 5; }
    .exp-pin text { font-size: 10px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; fill: #0e3b8f; }
    .exp-pin:hover circle { fill: #ff9500; r: 7; filter: drop-shadow(0 0 8px #ff9500); }
    .exp-pin:hover text { fill: #fff; font-weight: 700; }
    .exp-pin.prod circle { fill: #fff; }

    .role-label { font-size: 12px; font-weight: 500; fill: rgba(255,255,255,0.6); }
    .me-block { fill: #ff9500; }
    .me-text { font-size: 14px; font-weight: 700; fill: #0e3b8f; text-anchor: middle; }

    .title-text { font-size: 20px; font-weight: 700; letter-spacing: 1px; fill: rgba(255,255,255,0.8); }
    .subtitle { font-size: 12px; fill: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
<svg width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" fill="#0e3b8f"/>

  <!-- Title -->
  <text class="title-text" x="600" y="40" text-anchor="middle">YOUR JOURNEY · 2022 → 2026</text>
  <text class="subtitle" x="600" y="58" text-anchor="middle">Engineering & Product roads converge to your future role</text>

  <!-- 2022 Row -->
  <g class="year-row">
    <text class="year-label" x="30" y="105">2022</text>
    <line x1="120" y1="95" x2="400" y2="95" class="road-eng"/>
    <g class="exp-pin">
      <circle cx="140" cy="95"/>
      <text x="140" y="98">MV</text>
      <title>Metaverse · Nov 2022</title>
    </g>
  </g>

  <!-- 2023 Row -->
  <g class="year-row">
    <text class="year-label" x="30" y="175">2023</text>
    <line x1="120" y1="165" x2="500" y2="165" class="road-eng"/>
    <g class="exp-pin">
      <circle cx="160" cy="165"/>
      <text x="160" y="168">OM</text>
      <title>OMERS · May 2023</title>
    </g>
  </g>

  <!-- 2024 Row -->
  <g class="year-row">
    <text class="year-label" x="30" y="245">2024</text>
    <line x1="120" y1="235" x2="600" y2="235" class="road-eng"/>
    <line x1="500" y1="260" x2="800" y2="260" class="road-prod"/>

    <g class="exp-pin">
      <circle cx="200" cy="235"/>
      <text x="200" y="238">IN</text>
      <title>Intuit · May 2024</title>
    </g>
  </g>

  <!-- 2025 Row -->
  <g class="year-row">
    <text class="year-label" x="30" y="315">2025</text>
    <line x1="120" y1="305" x2="700" y2="305" class="road-eng"/>
    <line x1="500" y1="330" x2="900" y2="330" class="road-prod"/>

    <g class="exp-pin">
      <circle cx="250" cy="305"/>
      <text x="250" y="308">IV</text>
      <title>Ivey · May 2025</title>
    </g>
    <g class="exp-pin">
      <circle cx="300" cy="305"/>
      <text x="300" y="308">TS</text>
      <title>Tesla · May 2025</title>
    </g>
    <g class="exp-pin prod">
      <circle cx="680" cy="330"/>
      <text x="680" y="333">AE+</text>
      <title>Engineering grows</title>
    </g>
  </g>

  <!-- 2026 Row (Convergence) -->
  <g class="year-row">
    <text class="year-label" x="30" y="400">2026</text>
    <!-- Roads converge to center -->
    <path d="M 120 390 Q 400 390 650 405" class="road-eng"/>
    <path d="M 500 415 Q 550 410 650 405" class="road-prod"/>

    <g class="exp-pin">
      <circle cx="340" cy="390"/>
      <text x="340" y="393">AE</text>
      <title>Autodesk Eng · Jan 2026</title>
    </g>
    <g class="exp-pin prod">
      <circle cx="580" cy="415"/>
      <text x="580" y="418">AP</text>
      <title>Autodesk PM · May 2026</title>
    </g>
  </g>

  <!-- YOU (Center convergence point) -->
  <rect class="me-block" x="600" y="370" width="130" height="90" rx="6"/>
  <text class="me-text" x="665" y="405">JASMINE GU</text>
  <text class="me-text" x="665" y="425" style="font-size: 12px; font-weight: 500;">PRODUCT ENGINEER</text>

  <!-- Legend -->
  <g transform="translate(900, 450)">
    <rect x="0" y="0" width="240" height="130" fill="rgba(0,0,0,0.2)" rx="4"/>
    <line x1="8" y1="18" x2="30" y2="18" class="road-eng"/>
    <text x="40" y="22" style="font-size: 12px;">Engineering Path</text>

    <line x1="8" y1="50" x2="30" y2="50" class="road-prod"/>
    <text x="40" y="54" style="font-size: 12px;">Product Path</text>

    <circle cx="19" cy="82" r="5" fill="#ff9500"/>
    <text x="40" y="86" style="font-size: 12px;">Hover to explore</text>
  </g>
</svg>

<script>
  document.querySelectorAll('.exp-pin').forEach(pin => {
    pin.addEventListener('mouseenter', function() {
      document.querySelectorAll('.exp-pin').forEach(p =>
        p.style.opacity = p === this ? '1' : '0.3'
      );
    });
    pin.addEventListener('mouseleave', function() {
      document.querySelectorAll('.exp-pin').forEach(p => p.style.opacity = '1');
    });
  });
</script>
</body>
</html>
