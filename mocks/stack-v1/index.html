<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stack v1 - Primitives</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#0e3b8f;--paper:#fffefb;--orange:#ed3801;--line:#e8f1ff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 0}
.card{container-type:inline-size;width:min(560px,100%);background:var(--blue);border-radius:1.35rem;padding:6cqw 5cqw 5cqw;color:var(--line);
 background-image:linear-gradient(rgba(232,241,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(232,241,255,.06) 1px,transparent 1px);background-size:32px 32px}
.stack{display:flex;flex-direction:column}
.layer{display:flex;align-items:center;margin-top:-7cqw;outline:none;cursor:default;--lift:0px}
.layer:first-child{margin-top:0}
.txt{flex:1;min-width:0;padding-right:2cqw;transition:opacity .25s}
.lab{font:500 max(11px,2.7cqw)/1.25 'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:.6em;align-items:baseline}
.lab i{flex:none;width:.55em;height:.55em;background:var(--orange);border-radius:50%;transform:translateY(-.05em)}
svg{width:64%;flex:none;display:block;overflow:visible}
.body{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.prim{opacity:.22;transition:opacity .3s;stroke:var(--line);fill:none;stroke-width:1.5}
.top{fill:rgba(232,241,255,.10);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.sl{fill:rgba(6,28,72,.9);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.sr{fill:rgba(4,20,54,.95);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.base{fill:var(--blue)}
.hot .top{fill:var(--orange)}
.stack .layer{transition:opacity .3s}
.stack:has(.layer:hover,.layer:focus-visible) .layer:not(:hover):not(:focus-visible){opacity:.4}
.layer:hover .body,.layer:focus-visible .body{transform:translateY(-8px)}
.layer:hover .prim,.layer:focus-visible .prim{opacity:.6}
.layer:focus-visible .lab{outline:2px solid var(--orange);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2.4cqw}
.chips span{font:400 max(11px,2.4cqw) 'JetBrains Mono',monospace;border:1px solid rgba(232,241,255,.5);border-radius:99px;padding:.25em .8em}
@media (prefers-reduced-motion:reduce){.body,.prim,.layer{transition:none!important}.layer:hover .body,.layer:focus-visible .body{transform:none}}
</style></head><body>
<div class="card"><div class="stack" id="s"></div></div>
<script>
const W=130,H=46,T=12,cx=160,cy=134;
const P=(x,y)=>x+','+y;
const prims={
 cube:()=>{const c=[160,58],r=44,dx=r*.87,g=[];
  const top=[[c[0],c[1]-r],[c[0]+dx,c[1]-r/2],[c[0],c[1]],[c[0]-dx,c[1]-r/2]];
  const pts=(a)=>a.map(p=>p.join(',')).join(' ');
  return `<polygon points="${pts(top)}"/><polygon points="${pts([[c[0]-dx,c[1]-r/2],[c[0],c[1]],[c[0],c[1]+r],[c[0]-dx,c[1]+r/2]])}"/><polygon points="${pts([[c[0]+dx,c[1]-r/2],[c[0],c[1]],[c[0],c[1]+r],[c[0]+dx,c[1]+r/2]])}"/>
  <path d="M${c[0]-dx/2} ${c[1]-r*.75}L${c[0]+dx/2} ${c[1]-r*.25}M${c[0]+dx/2} ${c[1]-r*.75}L${c[0]-dx/2} ${c[1]-r*.25}M${c[0]-dx/2} ${c[1]+r*.25}v${r}M${c[0]+dx/2} ${c[1]+r*.25}v${r}"/>`},
 pair:()=>`<circle cx="132" cy="56" r="42"/><circle cx="188" cy="56" r="42" stroke-dasharray="5 5"/><path d="M160 22v68"/>`,
 tri:()=>`<polygon points="160,8 208,92 112,92" stroke-linejoin="miter"/><path d="M160 8v84"/>`,
 orbit:()=>`<circle cx="160" cy="54" r="40"/><ellipse cx="160" cy="54" rx="72" ry="22" transform="rotate(-18 160 54)"/><circle cx="222" cy="36" r="5" fill="#e8f1ff" stroke="none"/>`
};
const L=[
 {t:'Product / Business',p:'orbit',hot:1},
 {t:'Frontend specialized',p:'tri'},
 {t:'Full-stack',p:'pair'},
 {t:'Software Engineering',p:'cube',chips:['C++','Java','Python','TypeScript/React']}
];
const pts=(y)=>`${cx},${y-H} ${cx+W},${y} ${cx},${y+H} ${cx-W},${y}`;
document.getElementById('s').innerHTML=L.map(l=>`<div class="layer" tabindex="0" aria-label="${l.t}">
 <div class="txt"><div class="lab"><i></i><span>${l.t}</span></div></div>
 <svg viewBox="0 0 320 184" aria-hidden="true"><g class="prim" transform="translate(160 52) scale(1.15) translate(-160 -54)">${prims[l.p]()}</g>
 <g class="body ${l.hot?'hot':''}"><polygon class="base" points="${pts(cy)}"/>
 <polygon class="sl" points="${cx-W},${cy} ${cx},${cy+H} ${cx},${cy+H+T} ${cx-W},${cy+T}"/>
 <polygon class="sr" points="${cx},${cy+H} ${cx+W},${cy} ${cx+W},${cy+T} ${cx},${cy+H+T}"/>
 <polygon class="top" points="${pts(cy)}"/></g></svg></div>`).join('')
 + '';
const last=document.querySelector('.layer:last-child .txt');
last.insertAdjacentHTML('beforeend','<div class="chips">'+L[3].chips.map(c=>`<span>${c}</span>`).join('')+'</div>');
</script></body></html>
